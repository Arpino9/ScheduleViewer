<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <rect width="192" height="192" rx="28" fill="#1e2a3a"/>
  <!-- カレンダー本体 -->
  <rect x="24" y="52" width="144" height="116" rx="10" fill="none" stroke="#7eb8e8" stroke-width="7"/>
