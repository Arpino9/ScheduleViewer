spring:
  application:
    name: schedule-viewer-api
  datasource:
    url: jdbc:sqlite:${SQLITE_DB_PATH:C:/Users/okaji/source/repos/ScheduleViewer/ScheduleViewer.Infrastructure/ScheduleViewer.db}
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: none
    show-sql: false
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 50MB

server:
  port: ${SERVER_PORT:9080}

scheduleviewer:
  database-path: ${SQLITE_DB_PATH:C:/Users/okaji/source/repos/ScheduleViewer/ScheduleViewer.Infrastructure/ScheduleViewer.db}
  local-photo-base-path: ${LOCAL_PHOTO_BASE_PATH:C:/Users/okaji/Desktop/Google Photo}
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,https://localhost:*,http://127.0.0.1:*}
  nominatim:
    base-url: ${NOMINATIM_BASE_URL:https://nominatim.openstreetmap.org}
  google:
    api-key:            ${GOOGLE_API_KEY:}
    client-secret-path: ${GOOGLE_CLIENT_SECRET_PATH:}
    drive-folder-id:    ${GOOGLE_DRIVE_FOLDER_ID:}
    calendar-id:        ${GOOGLE_CALENDAR_ID:}
  annict:
    token: ${ANNICT_TOKEN:}

logging:
  level:
    com.scheduleviewer: DEBUG
    org.springframework.web: INFO
