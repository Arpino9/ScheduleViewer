name: Build and deploy JAR app to Azure Web App - schedule-viewer-api-arpino9

on:
  push:
    branches:
      - master
    paths:
      - 'schedule-viewer-api/**'
      - '.github/workflows/master_schedule-viewer-api-arpino9.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Set up Java version
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'microsoft'
          cache: 'maven'
          cache-dependency-path: 'schedule-viewer-api/pom.xml'

      - name: Build with Maven
        run: mvn -f schedule-viewer-api/pom.xml clean package -DskipTests

      - name: Upload executable JAR
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: '${{ github.workspace }}/schedule-viewer-api/api/target/api-*.jar'
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: java-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_CFD0A45F8025454C95FA0792B8F056EA }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_AF24C7C87778480EB1AC30E3113C0D00 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D86120A7EA9543C1B59DFE9843A47D10 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'schedule-viewer-api-arpino9'
          slot-name: 'Production'
          package: '*.jar'
